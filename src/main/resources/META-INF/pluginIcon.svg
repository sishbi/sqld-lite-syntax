<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The same database cylinder as the 16px file icon, drawn in the plugin's gradient so the two
       icons read as one set. No lettering, so the tile stays legible at 20px and needs no font. -->
  <defs>
    <linearGradient id="g" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BEA62"/>
      <stop offset="0.52" stop-color="#3C99CC"/>
      <stop offset="1" stop-color="#6B57FF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round">
    <ellipse cx="20" cy="9" rx="13" ry="5"/>
    <path d="M7 9v22c0 2.76 5.82 5 13 5s13-2.24 13-5V9"/>
    <path d="M7 20c0 2.76 5.82 5 13 5s13-2.24 13-5"/>
  </g>
</svg>
